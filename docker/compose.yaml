services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SATMUX_UID: ${SATMUX_CONTAINER_UID:-10001}
        SATMUX_GID: ${SATMUX_CONTAINER_GID:-10001}
    command:
      - server
      - --host
      - 0.0.0.0
      - --port
      - "8444"
      - --psk-file
      - /run/secrets/mux_psk
    ports:
      - "${SATMUX_SERVER_PUBLISH:-0.0.0.0}:${SATMUX_SERVER_PORT:-8444}:8444"
    secrets:
      - mux_psk
    extra_hosts:
      - "host.docker.internal:host-gateway"
    user: "${SATMUX_CONTAINER_UID:-10001}:${SATMUX_CONTAINER_GID:-10001}"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  client:
    profiles:
      - client
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SATMUX_UID: ${SATMUX_CONTAINER_UID:-10001}
        SATMUX_GID: ${SATMUX_CONTAINER_GID:-10001}
    command:
      - client
      - --host
      - "${SATMUX_SERVER_HOST:-server}"
      - --port
      - "8444"
      - --psk-file
      - /run/secrets/mux_psk
      - --proxy-host
      - 0.0.0.0
      - --carriers
      - "${SATMUX_CARRIERS:-12}"
      - --socks-port
      - "1080"
      - --http-port
      - "8080"
      - --fast-port
      - "8081"
      - --gh-sock
      - ""
    ports:
      - "127.0.0.1:${SATMUX_SOCKS_PORT:-1080}:1080"
      - "127.0.0.1:${SATMUX_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${SATMUX_FAST_PORT:-8081}:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - mux_psk
    user: "${SATMUX_CONTAINER_UID:-10001}:${SATMUX_CONTAINER_GID:-10001}"
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  mux_psk:
    file: ${SATMUX_SECRET_FILE:-./secrets/mux.psk}
